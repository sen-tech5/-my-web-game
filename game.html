<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090817"><title>سرّ المعبد | رواية تفاعلية</title>
<style>
:root{--ink:#f8f2ff;--muted:#c7bddb;--pink:#f05acb;--violet:#9b7cff;--gold:#f6d68b}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#090817;color:var(--ink);font-family:system-ui,Tahoma,sans-serif;overflow-x:hidden}
.game{min-height:100svh;display:flex;flex-direction:column;position:relative;isolation:isolate;background:radial-gradient(ellipse at 50% 5%,#49316d 0,transparent 45%),linear-gradient(#17112e,#090817 75%)}
.game:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;background-image:radial-gradient(2px 2px at 12% 20%,#fff 60%,transparent),radial-gradient(1px 1px at 78% 17%,#fff 60%,transparent),radial-gradient(2px 2px at 62% 38%,#f9c9ff 60%,transparent),radial-gradient(1px 1px at 25% 62%,#fff 60%,transparent),radial-gradient(1px 1px at 89% 55%,#fff 60%,transparent);background-size:240px 220px}
.top{width:min(100%,980px);margin:auto;padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;letter-spacing:.4px}.chapter{font-size:.84rem;color:var(--gold);border:1px solid #f6d68b55;border-radius:30px;padding:5px 12px}
.stage{width:min(100%,980px);margin:auto;flex:1;min-height:420px;display:flex;align-items:flex-end;justify-content:center;position:relative;padding:0 16px}
.moon{position:absolute;width:min(60vw,420px);aspect-ratio:1;border-radius:50%;top:7%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 38% 35%,#c9a9ff,#75549f 48%,#3b285d 70%);opacity:.2;filter:blur(1px);box-shadow:0 0 100px #a86dff44}
.character{position:relative;z-index:1;height:min(62vh,590px);max-width:90vw;object-fit:contain;object-position:bottom;filter:drop-shadow(0 15px 28px #05020d99);transition:opacity .2s,transform .2s}
.missing{position:absolute;z-index:2;bottom:12px;background:#120f24dd;border:1px dashed #f05acb99;border-radius:12px;padding:9px 14px;color:#ffd5f4;font-size:.82rem;display:none}
.dialogue-wrap{width:min(100%,980px);margin:0 auto;padding:0 14px max(18px,env(safe-area-inset-bottom))}
.dialogue{position:relative;background:linear-gradient(135deg,#17132df2,#0e1026f5);border:1px solid #b98aff66;border-radius:22px;padding:18px 19px 16px;box-shadow:0 12px 50px #0008;backdrop-filter:blur(14px)}
.name{display:inline-block;color:#ff9de7;font-weight:900;margin-bottom:5px}.text{font-size:1.02rem;line-height:1.9;min-height:58px;color:#f5efff}
.choices{display:grid;gap:9px;margin-top:15px}.choice{width:100%;text-align:right;border:1px solid #9874d977;border-radius:13px;background:#272044;color:#fff;padding:12px 14px;font:inherit;cursor:pointer;transition:.18s}.choice:hover,.choice:focus-visible{outline:none;background:#46306b;border-color:#f08bd9;transform:translateY(-1px)}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:13px;color:#a99bbd;font-size:.78rem}.small{background:transparent;border:0;color:#d8c7f4;font:inherit;cursor:pointer;padding:5px}
.end{text-align:center;padding:8px}.end h2{color:var(--gold)}.restart{border:0;border-radius:12px;padding:11px 20px;background:linear-gradient(100deg,#f05acb,#8867ff);color:white;font:inherit;font-weight:800;cursor:pointer}
@media(min-width:700px){.stage{min-height:510px}.character{height:min(68vh,650px)}.dialogue{padding:22px 26px}.choices{grid-template-columns:1fr 1fr}.choice:last-child:nth-child(odd){grid-column:1/-1}}
@media(max-height:700px){.stage{min-height:310px}.character{height:48vh}.dialogue-wrap{padding-bottom:10px}.text{min-height:45px}}
</style></head>
<body><main class="game">
<header class="top"><div class="logo">✦ حكايات العوالم</div><div class="chapter" id="chapter">الفصل الأول · البداية</div></header>
<section class="stage"><div class="moon"></div><img class="character" id="character" src="assets/character.webp" alt="ليانا، حارسة المعبد"><div class="missing" id="missing">أضف صورة الشخصية إلى assets/character.webp</div></section>
<section class="dialogue-wrap"><div class="dialogue" aria-live="polite"><div class="name" id="name">ليانا</div><div class="text" id="line">أخيراً وصلتَ... ظننت أن الطريق إلى الوادي قد ابتلعك.</div><div class="choices" id="choices"><button class="choice" data-next="1">من أنتِ؟ وأين أنا؟</button><button class="choice" data-next="2">أخبريني لماذا طلبتِ حضوري.</button></div><div class="controls"><span id="progress">المشهد 1</span><button class="small" id="restart">↻ إعادة من البداية</button></div></div></section>
</main>
<script>
const scenes={
0:{chapter:"الفصل الأول · البداية",name:"ليانا",line:"أخيراً وصلتَ... ظننت أن الطريق إلى الوادي قد ابتلعك. المعبد لم يعد آمناً، والوقت ينفد.",choices:[["من أنتِ؟ وأين أنا؟",1],["أخبريني لماذا طلبتِ حضوري.",2]]},
1:{chapter:"الفصل الأول · الغريبة",name:"ليانا",line:"اسمي ليانا، وأنا حارسة هذا المعبد. أنت في وادي الأقمار، آخر مكان بقي فيه الضوء القديم.",choices:[["ما الذي حدث للمعبد؟",3],["لا أثق بكِ. سأغادر.",4]]},
2:{chapter:"الفصل الأول · الرسالة",name:"ليانا",line:"وجدتُ هذه الخريطة قرب البوابة. إنها تحمل اسمك، وتشير إلى غرفة مختومة لم تُفتح منذ مئات السنين.",choices:[["لنفتح الغرفة معاً.",3],["أريد رؤية الخريطة أولاً.",5]]},
3:{chapter:"الفصل الثاني · النداء",name:"ليانا",line:"إذن اتخذنا القرار. اسمع... هناك صوت خلف الباب، وكأنه يعرف أننا هنا. هل أنت مستعد؟",choices:[["أفتح الباب بحذر.",6],["لنبحث عن مدخل آخر.",7]]},
4:{chapter:"نهاية مؤقتة · الطريق المنفرد",name:"ليانا",line:"لن أجبرك على البقاء. لكن تذكّر: بعض الأبواب إذا تُركت مغلقة، لا تبقى مغلقة إلى الأبد.",ending:"انتهى هذا المسار عند بوابة الوادي."},
5:{chapter:"الفصل الثاني · الخريطة",name:"ليانا",line:"تأمل الرمز في وسطها... إنه مطابق للقلادة التي أحملها. يبدو أن قصتنا متشابكة أكثر مما توقعت.",choices:[["أثق بكِ، لنكمل.",3],["أريد معرفة سر القلادة.",8]]},
6:{chapter:"الفصل الثالث · خلف الباب",name:"ليانا",line:"الضوء... إنه يستجيب لوجودك! لم أرَ هذا يحدث من قبل. أظن أن المعبد كان ينتظرك أنت تحديداً.",ending:"اكتشفت أن لديك صلة غامضة بالمعبد."},
7:{chapter:"الفصل الثالث · الممر الخفي",name:"ليانا",line:"وجدت ممراً خلف النقوش. الهواء القادم منه دافئ، وتسمع في نهايته نغمة مألوفة.",ending:"فتحت طريقاً سرياً إلى قلب المعبد."},
8:{chapter:"الفصل الثاني · القلادة",name:"ليانا",line:"كانت لأمي. تركت معها رسالة تقول إن حارسة القلادة ستلتقي يوماً بالشخص القادر على إيقاظ النور.",choices:[["إذن فلنوقظ النور.",6],["لنكتشف الممر السري أولاً.",7]]}
};
let current=0;const $=id=>document.getElementById(id);
function render(id){current=id;const s=scenes[id];$("chapter").textContent=s.chapter;$("name").textContent=s.name;$("line").textContent=s.line;$("progress").textContent="المشهد "+(id+1);const box=$("choices");box.innerHTML="";
if(s.ending){const p=document.createElement("p");p.className="end";p.textContent=s.ending;box.appendChild(p);const b=document.createElement("button");b.className="restart";b.textContent="ابدأ من جديد";b.onclick=()=>render(0);box.appendChild(b);return}
s.choices.forEach(([label,next])=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>render(next);box.appendChild(b)})}
$("restart").onclick=()=>render(0);$("character").addEventListener("error",()=>{$("missing").style.display="block"});render(0);
</script></body></html>
